name: Validate Plugin

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository:
    name: Repository validator (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # EncodingWarning turns any file read without an explicit encoding into an error, so a
      # read that would use the Windows ANSI code page (cp1254, cp1252...) fails on Linux too.
      - name: Validate skills, agents, manifests, references and counts
        run: python3 -X warn_default_encoding -W error::EncodingWarning scripts/validate.py --verbose

  hooks:
    name: Hook test suite (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # On Windows this is Git Bash, the shell Claude Code runs hooks with. Its checkout uses
    # core.autocrlf=true, so this job also proves .gitattributes keeps the hooks LF.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run hooks under POSIX sh (jq, python3 and sed parsers)
        run: bash tests/hooks.test.sh -v

  claude-code:
    name: Claude Code plugin validate --strict
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code
      - name: Validate plugin and marketplace manifests
        run: claude plugin validate . --strict
